name: GameNative package

on:
  push:
    tags: ['gn-*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version name (e.g. 2.7.1-gn1)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#gn-}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"

      - name: Install toolchain
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build glslang-tools mingw-w64 mingw-w64-tools zstd xz-utils
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix
          x86_64-w64-mingw32-g++ --version | head -1
          glslangValidator --version | head -1

      - name: Build (mingw-w64)
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/build/dxvk-$VERSION_NAME"
          for arch in 64 32; do
            meson setup --cross-file "build-win$arch.txt" \
              --buildtype release --prefix "$out" --bindir "x$arch" --libdir "x$arch" \
              --strip -Db_ndebug=if-release -Dbuild_id=false "build/b$arch"
            ninja -C "build/b$arch" install
            rm -f "$out/x$arch"/*.a
          done
          ls -la "$out/x64" "$out/x32"

      - name: Package for GameNative
        shell: bash
        run: |
          set -euo pipefail
          src="build/dxvk-$VERSION_NAME"
          pkg="pkg"
          mkdir -p "$pkg/system32" "$pkg/syswow64"
          cp "$src"/x64/*.dll "$pkg/system32/"
          cp "$src"/x32/*.dll "$pkg/syswow64/"
          python3 - "$pkg" "$VERSION_NAME" <<'PY'
          import json, os, sys
          pkg, ver = sys.argv[1], sys.argv[2]
          files = []
          for d, var in (("system32", "${system32}"), ("syswow64", "${syswow64}")):
              for f in sorted(os.listdir(os.path.join(pkg, d))):
                  files.append({"source": f"{d}/{f}", "target": f"{var}/{f}"})
          json.dump({"type": "DXVK", "versionName": ver, "versionCode": 1,
                     "description": f"DXVK {ver} (GameNative build)", "files": files},
                    open(os.path.join(pkg, "profile.json"), "w"), indent=2)
          PY
          mkdir -p out
          tar -C "$pkg" --zstd -cf "out/dxvk-$VERSION_NAME.tzst" system32 syswow64
          tar -C "$pkg" -cJf "out/dxvk-$VERSION_NAME.wcp" profile.json system32 syswow64
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-${{ env.VERSION_NAME }}
          path: out/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/gn-')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
